<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Teacher : Maths is not Toxic.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#35cfff;--pink:#ff2f7e;--red:#ff1e2d}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#020204;overflow:hidden;font-family:'Poppins',sans-serif;
    user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .8s ease}
  .overlay.show{opacity:1}

  #titleCard h1{font-weight:300;color:#f2f2f2;letter-spacing:.04em;line-height:1.7;
    font-size:clamp(1.25rem,4.2vw,2.4rem);text-align:center;padding:0 1rem}
  #titleCard em{font-family:'Caveat',cursive;font-style:normal;color:var(--red);
    font-size:1.4em;display:inline-block;transform:rotate(-4deg)}
  .q{color:#ffd400;font-size:.55em;vertical-align:super;line-height:0;margin:0 .35em}
  .nowrap{white-space:nowrap}

  #meanwhile{align-items:flex-start}
  #meanwhile p{padding-top:21vh;color:#eaeaea;font-weight:300;letter-spacing:.12em;
    font-size:clamp(1rem,3vw,1.55rem);text-align:center;width:100%}

  /* lyrics — cursive stylish, placed exactly like the video frames */
  .line{position:fixed;transform:translateY(-50%);color:#fff;pointer-events:none;
    font-family:'Dancing Script',cursive;font-weight:600;
    font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.35;letter-spacing:.02em;
    max-width:var(--w,14ch);text-shadow:0 0 16px rgba(255,255,255,.3)}
  #l1{left:61%;top:51%;--w:11ch}
  #l2{left:59%;top:52%;--w:13ch}
  #l3{left:56%;top:48%;--w:14ch}
  .line span{display:inline-block;opacity:0;transform:translateY(10px) rotate(4deg);
    transition:opacity .4s ease,transform .4s ease}
  .line.show span{opacity:1;transform:none;transition-delay:calc(var(--i)*var(--st))}

  #startBtn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    font-family:'Poppins',sans-serif;letter-spacing:.25em;font-size:.85rem;color:#9adfff;
    background:transparent;border:1px solid rgba(120,220,255,.4);padding:1em 2.2em;
    border-radius:999px;cursor:pointer;transition:opacity .5s,background .3s;z-index:5}
  #startBtn:hover{background:rgba(120,220,255,.08)}
  #startBtn.hide{opacity:0;pointer-events:none}
  #replay{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);
    font-family:'Poppins',sans-serif;letter-spacing:.2em;font-size:.8rem;color:#9adfff;
    background:transparent;border:1px solid rgba(120,220,255,.35);padding:.65em 1.6em;
    border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s}
  #replay.show{opacity:1;pointer-events:auto}
  @media (max-width:600px){.line{left:auto!important;right:7%}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<div class="overlay" id="titleCard">
  <h1><span class="q">“</span>Teacher : Maths is not
    <span class="nowrap"><em>Toxic.</em><span class="q">”</span></span></h1>
</div>
<div class="overlay" id="meanwhile"><p>meanwhile maths in my head :</p></div>

<p class="line" id="l1" style="--st:.3s">
  <span style="--i:0">Kyu</span> <span style="--i:1">iss</span>
  <span style="--i:2">tarah</span> <span style="--i:3">se</span></p>
<p class="line" id="l2" style="--st:.28s">
  <span style="--i:0">duniya</span> <span style="--i:1">jaha</span>
  <span style="--i:2">mein</span> <span style="--i:3">karta</span>
  <span style="--i:4">hai</span> <span style="--i:5">meri</span>
  <span style="--i:6">rushwayi</span></p>
<p class="line" id="l3" style="--st:.32s">
  <span style="--i:0">tera</span> <span style="--i:1">kasoor</span>
  <span style="--i:2">aur</span> <span style="--i:3">zaalima</span>
  <span style="--i:4">mai</span> <span style="--i:5">kehlayi</span>
  <span style="--i:6">♡</span></p>

<button id="startBtn">▶&nbsp;&nbsp;PLAY</button>
<button id="replay">↻&nbsp;&nbsp;REPLAY</button>

<script>
/* ============ AUDIO HOOK : drop your song here, everything stays synced ============ */
const AUDIO_URL = "";               // e.g. "kasoor.mp3" — starts with the timeline
let audio = AUDIO_URL ? new Audio(AUDIO_URL) : null;

const $=s=>document.querySelector(s);
const canvas=$('#scene'),ctx=canvas.getContext('2d');
const titleCard=$('#titleCard'),meanwhile=$('#meanwhile'),
      replayBtn=$('#replay'),startBtn=$('#startBtn');
const lines=[$('#l1'),$('#l2'),$('#l3')];
const TAU=Math.PI*2,D2R=Math.PI/180;

let W,H,DPR,baseScale;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';
  baseScale=Math.min(W,H)/780;}
addEventListener('resize',resize);resize();

/* ============ geometry ============ */
const R=250,AL=70*D2R;
const PT={x:R*Math.cos(AL),y:R*Math.sin(AL)};      // tangent point
const U ={x:Math.sin(AL),y:-Math.cos(AL)};
const A0=-Math.PI/2;

/* smooth keyframe interpolator (ease in/out between keys) */
function key(keys,t){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){
    const[a,va]=keys[i],[b,vb]=keys[i+1];
    if(t<=b){const u=(t-a)/(b-a),s=u*u*(3-2*u);return va+(vb-va)*s;}
  }
  return keys[keys.length-1][1];
}
/* anim clock tau = t-2  →  dots TOUCH at tau 4 = t 6.0s exactly */
const cyanA=tau=>A0-key([[0,0],[4,200],[15,315],[26,350]],tau)*D2R;
const pinkP=tau=>key([[-850&&0,-850],[0,-850],[4,0],[15,480],[26,900]],tau);
const cyan=t=>{const a=cyanA(t);return{x:R*Math.cos(a),y:R*Math.sin(a)}};
const pink=t=>{const p=pinkP(t);return{x:PT.x+U.x*p,y:PT.y+U.y*p}};

/* ============ master timeline (absolute seconds) ============ */
const LY=[[7.8,9.9],[10.0,12.8],[13.0,16.8]];   // lyric windows
const DUR=29;
let started=false,start=0,last=performance.now();
let cam={x:0,y:-10,z:1};

function begin(){started=true;start=performance.now();last=start;
  if(audio){audio.currentTime=0;audio.play();}}
startBtn.addEventListener('click',()=>{startBtn.classList.add('hide');begin();});
replayBtn.addEventListener('click',()=>{replayBtn.classList.remove('show');begin();});

function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  const t=started?(now-start)/1000:-1;
  const tau=Math.min(Math.max(t-2,0),27);

  titleCard.classList.toggle('show',t>.2&&t<3.2);
  meanwhile.classList.toggle('show',t>3.4&&t<5.8);
  lines.forEach((el,i)=>el.classList.toggle('show',t>=LY[i][0]&&t<=LY[i][1]));
  replayBtn.classList.toggle('show',t>DUR+.3);

  /* camera — punch-in at the touch, follow dots, zoom-out, slow zoom-in */
  const c=cyan(tau),k=pink(tau);
  let tgt={x:0,y:-10,z:1};
  if(t>=3){
    if(t<6)        tgt={x:0,y:-10,z:1};
    else if(t<7.8) tgt={x:PT.x,y:PT.y,z:2.2};
    else if(t<10)  tgt={x:(c.x+k.x)/2,y:(c.y+k.y)/2,z:2.35};
    else if(t<13)  tgt={x:c.x,y:c.y,z:2.5};
    else if(t<15)  tgt={x:k.x,y:k.y,z:2.6};
    else if(t<17)  tgt={x:c.x,y:c.y,z:2.5};
    else if(t<24)  tgt={x:0,y:-10,z:1};
    else           tgt={x:0,y:-10,z:1.32};
  }
  const kk=1-Math.exp(-dt*3);
  cam.x+=(tgt.x-cam.x)*kk;cam.y+=(tgt.y-cam.y)*kk;cam.z+=(tgt.z-cam.z)*kk;

  draw(t,tau);
  requestAnimationFrame(frame);
}

function draw(t,tau){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#020204';ctx.fillRect(0,0,W,H);
  if(t<3)return;
  const S=baseScale*cam.z;
  const px=p=>({x:(p.x-cam.x)*S+W/2,y:(p.y-cam.y)*S+H/2});
  const seg=(a,b)=>{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()};
  const c=px({x:0,y:0});

  let g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,R*.6*S);
  g.addColorStop(0,'rgba(70,10,14,.4)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(c.x-R*S,c.y-R*S,2*R*S,2*R*S);

  ctx.strokeStyle='rgba(255,80,80,.12)';ctx.lineWidth=Math.max(1,S*.7);
  const r1=.17,r2=r1+Math.PI/2,L=R*1.15;
  seg(px({x:-Math.cos(r1)*L,y:-Math.sin(r1)*L}),px({x:Math.cos(r1)*L,y:Math.sin(r1)*L}));
  seg(px({x:-Math.cos(r2)*L,y:-Math.sin(r2)*L}),px({x:Math.cos(r2)*L,y:Math.sin(r2)*L}));

  ctx.strokeStyle='rgba(110,200,255,.13)';ctx.lineWidth=Math.max(.8,1.2*S);
  ctx.beginPath();ctx.arc(c.x,c.y,R*S,0,TAU);ctx.stroke();
  ctx.strokeStyle='rgba(255,45,120,.13)';
  seg(px({x:PT.x-U.x*4000,y:PT.y-U.y*4000}),px({x:PT.x+U.x*4000,y:PT.y+U.y*4000}));

  ctx.lineCap='round';
  ctx.shadowColor='rgba(255,47,126,.9)';ctx.shadowBlur=14*S;
  ctx.strokeStyle='#ff2f7e';ctx.lineWidth=3.2*S;
  seg(px(pink(0)),px(pink(tau)));

  ctx.shadowColor='rgba(53,207,255,.9)';
  ctx.strokeStyle='#35cfff';
  ctx.beginPath();ctx.arc(c.x,c.y,R*S,A0,cyanA(tau),true);ctx.stroke();
  ctx.shadowBlur=0;

  for(let i=1;i<=6;i++){const tt=tau-i*.12;if(tt<0)continue;
    const a=.16*(1-i/7);
    ctx.fillStyle=`rgba(53,207,255,${a})`;
    const p1=px(cyan(tt));ctx.beginPath();ctx.arc(p1.x,p1.y,5.5*S,0,TAU);ctx.fill();
    const p2=px(pink(tt));ctx.beginPath();ctx.arc(p2.x,p2.y,5.5*S,0,TAU);ctx.fill();}

  /* 💥 flash at t = 6.0 — the exact touch moment */
  const ft=t-6;
  if(ft>-.05&&ft<1){const q=Math.max(ft,0),a=1-q,p=px(PT),rad=(40+300*q*q)*S;
    let fg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
    fg.addColorStop(0,`rgba(255,255,255,${.85*a})`);
    fg.addColorStop(.35,`rgba(160,230,255,${.5*a})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,TAU);ctx.fill();}

  for(const[pt,col]of[[cyan(tau),'53,207,255'],[pink(tau),'255,47,126']]){
    const p=px(pt);
    let hg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,26*S);
    hg.addColorStop(0,`rgba(${col},.4)`);hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(p.x,p.y,26*S,0,TAU);ctx.fill();
    ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=16*S;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,6.5*S,0,TAU);ctx.fill();
    ctx.shadowBlur=0;}

  /* fade-in from black 3.0→3.6 */
  const f=1-Math.min(Math.max((t-3)/.6,0),1);
  if(f>0){ctx.fillStyle=`rgba(2,2,4,${f})`;ctx.fillRect(0,0,W,H);}
}
requestAnimationFrame(frame);
</script>
</body>
</html>
